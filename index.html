<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Behind a prefix-stripping proxy (Coolify at /education/<slug>), /x and /x/ reach nginx as the same
         request; relative URLs only resolve with the slash, so add it before anything else loads. -->
    <script>if (!/\/$|\.[a-z]+$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Physics II</title>
    <meta name="description" content="A visual head start on Physics II (WashU PHYS 1742): fields, circuits, magnetism, light and early quantum physics, with interactive figures and checkpoints." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%232F3437' stroke-width='1.8'%3E%3Cpath d='M2.5 16.5c2.4-5.2 4.8-5.2 7.2 0s4.8 5.2 7.2 0'/%3E%3Ccircle cx='17.5' cy='6.5' r='4' fill='%23E1F3FE'/%3E%3Cpath d='M17.5 4.6v3.8M15.6 6.5h3.8'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- Part of the Education app: its manifest and service worker (samuelshuster.com/education/) cover this site too. -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
    <!-- Relative paths only: the site must work at a domain root and under a subpath (GitHub Pages). -->
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This site is interactive and needs JavaScript.</noscript>
  </body>
</html>
