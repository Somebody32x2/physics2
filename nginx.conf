# Static files behind Coolify's proxy, which strips the path prefix (e.g. /education/<slug>) before requests get here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No build step, so file names never change: always revalidate (cheap 304s).
    add_header Cache-Control "no-cache" always;

    # Narration clips are named by a hash of their content, so a file never changes: cache it for good.
    # (A location with its own add_header drops the server-level ones, so they are repeated here.)
    location ~ ^/audio/[0-9a-f]+\.mp3$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # Serve a folder's index.html directly. nginx's own "/trees -> /trees/" redirect would point
        # at a path without the stripped prefix; each index.html adds the trailing slash itself.
        try_files $uri $uri/index.html =404;
    }
}
